[package]
name = "rekkefly"
version = "0.6.0"
edition = "2024"
description = "Rekkefly, the new Kinefly: real-time wing tracking for tethered insects, with Kinefly-compatible ZMQ output"
keywords = ["kinefly", "insect-flight", "drosophila", "wing-tracking", "neuroscience"]
categories = ["science", "computer-vision", "multimedia::video"]
license = "MIT"
repository = "https://github.com/pvnkmrksk/rekkefly"
homepage = "https://pvnkmrksk.github.io/rekkefly/"
documentation = "https://pvnkmrksk.github.io/rekkefly/docs/"
readme = "README.md"

[features]
default = ["gui", "camera"]
gui = ["dep:eframe"]
camera = ["dep:nokhwa", "dep:v4l"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
nokhwa = { version = "0.10.10", default-features = false, features = ["input-native", "decoding"], optional = true }
tempfile = "3"
jpeg-encoder = { version = "0.7", features = ["simd"] }
zune-jpeg = "0.5"
zune-core = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = { version = "0.14", optional = true }

# A second, independent ZMTP 3 implementation for testing the ZMQ output.
[dev-dependencies]
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net"] }

# Image codecs are far too slow unoptimized; keep them fast in debug builds
# and tests (the Bogong moth tests decode real MJPEG video).
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.image]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "rekkefly"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
