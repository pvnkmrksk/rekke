<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Rekkefly</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <!-- GitHub Pages serves this page for any missing address, at any depth,
       so links are absolute to the project site. -->
  <link rel="icon" href="/rekkefly/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/rekkefly/assets/site.css">
  <script>try { var t = localStorage.getItem("rekkefly-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<main class="notfound">
  <div>
    <img src="/rekkefly/assets/logo.svg" alt="" width="88" height="88" style="margin: 0 auto">
    <h1>This page flew off.</h1>
    <p>The address may have changed when the documentation moved. Try the docs or the home page.</p>
    <div class="cta">
      <a class="btn btn-coral btn-large" href="/rekkefly/docs/">Documentation</a>
      <a class="btn btn-ghost btn-large" href="/rekkefly/">Home</a>
    </div>
  </div>
</main>
</body>
</html>
