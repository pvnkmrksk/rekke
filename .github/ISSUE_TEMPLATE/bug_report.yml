name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [troubleshooting guide](https://pvnkmrksk.github.io/rekkefly/docs/troubleshooting.html) first.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: With two cameras connected, `device = "auto"` opened ... I expected ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. rekkefly --config camera-b.toml
        2. Click Record
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rekkefly version
      description: The output of `rekkefly --version`.
      placeholder: rekkefly 0.6.1
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - macOS, Apple silicon
        - macOS, Intel
        - Windows 10/11
        - Ubuntu or another Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options:
        - Installer or app (.dmg, setup.exe, .deb)
        - Portable folder (ZIP or tarball)
        - Built from source
    validations:
      required: true
  - type: textarea
    id: camera
    attributes:
      label: Camera or video
      description: For camera problems, paste `rekkefly --list-cameras`. For video problems, the file's format.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Messages and config
      description: Error messages from the window or terminal, and the rig's config (TOML) if relevant.
      render: text
  - type: markdown
    attributes:
      value: |
        **Tracking problems:** a short clip helps most. Cut one with `rekkefly clip recording.avi clip.avi --start 10 --duration 5` and attach it (zip it if GitHub refuses the AVI), with a screenshot of the markers.
