name: Build and release
# Release builds, installers and smoke tests on Ubuntu, Windows and both Mac
# architectures: about 20 minutes. They run for release tags (v*, which also
# publish the release), when started by hand (Actions → Build and release →
# Run workflow), and for pull requests that change the packaging itself.
# Everything else, dependency updates included, gets the fast checks in ci.yml.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "scripts/package.py"
      - "scripts/windows-installer.nsi"
      - "assets/**"
      - "build.rs"
      - "INSTALL.txt"
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            binary: rekkefly
          - os: windows-2022
            platform: windows-x64
            binary: rekkefly.exe
            release_dir: target/x86_64-pc-windows-msvc/release
          - os: macos-15
            platform: macos-arm64
            binary: rekkefly
          - os: macos-15-intel
            platform: macos-x64
            binary: rekkefly
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is on a commit whose Cargo.toml says $version. Tag the commit that sets the version."
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config nasm clang libclang-dev libv4l-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1 xvfb
      - name: macOS packaging dependencies
        if: runner.os == 'macOS'
        run: |
          brew install nasm
          python -m pip install dmgbuild==1.6.7
      - name: Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm nsis --yes --no-progress
          "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - run: cargo build --release --locked
        if: runner.os != 'Windows'
      - name: Windows portable release
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Native smoke (sample video, rig launcher, recording, track, MCP)
        shell: bash
        run: |
          exe="${{ matrix.release_dir || 'target/release' }}/${{ matrix.binary }}"
          "$exe" --version
          "$exe" samples/bogong-moth.avi --headless --fast --frames 100
          mkdir -p smoke && cp configs/*.toml smoke/
          "$exe" --rigs smoke/rigs.toml --demo --headless --frames 30 --record
          ls smoke/recordings/*/video-0000.avi
          "$exe" clip samples/bogong-moth.avi smoke/clip.avi --duration 2 --format png
          "$exe" track samples/bogong-moth.avi --frames 60 --json | grep '"frames": 60'
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | "$exe" mcp --config-dir smoke | grep -q '"track_video"'
      - name: Package
        run: python scripts/package.py --platform ${{ matrix.platform }} --binary ${{ matrix.release_dir || 'target/release' }}/${{ matrix.binary }} --out dist
      - name: Ubuntu install and GUI smoke
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/rekkefly_*_amd64.deb
          rekkefly --version
          rekkefly --config /usr/share/rekkefly/configs/demo.toml --headless --frames 10
          rekkefly /usr/share/rekkefly/samples/bogong-moth.avi --headless --fast --frames 50
          xvfb-run -a rekkefly --config /usr/share/rekkefly/configs/demo.toml --screenshot dist/preview-linux.png
          # No camera on CI: a plain launch must fall back to the bundled sample.
          mkdir -p empty && cd empty && xvfb-run -a rekkefly --screenshot ../dist/preview-no-camera.png
      - name: Windows installer and icon smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*setup.exe).FullName
          $install = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $app = "$env:LOCALAPPDATA\Programs\Rekkefly\rekkefly.exe"
          & $app --version
          & $app --config configs/demo.toml --headless --frames 10
          if ($LASTEXITCODE -ne 0) { throw 'Installed executable failed' }
          & $app "$env:LOCALAPPDATA\Programs\Rekkefly\samples\bogong-moth.avi" --headless --fast --frames 50
          if ($LASTEXITCODE -ne 0) { throw 'Installed sample video failed' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($app)
          if ($null -eq $icon) { throw 'Executable icon missing' }
          $icon.Dispose()
      - uses: actions/upload-artifact@v7
        with:
          name: Rekkefly-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip *.dmg *.deb *.tar.gz *setup.exe > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.dmg dist/*.deb dist/*.tar.gz dist/*setup.exe dist/SHA256SUMS.txt --verify-tag --title "Rekkefly ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md --latest
