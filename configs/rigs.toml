# Rig manifest: start every rig with ONE command, each in its own window
# (or headless) with its own camera, ports, background and recordings.
#
#   rekkefly --rigs rigs.toml                    one window per rig
#   rekkefly --rigs rigs.toml --headless --record
#   rekkefly --rigs rigs.toml --demo             check the set without cameras
#
# Each [[rigs]] entry may set:
#   label      name in the window title, logs and recording folders
#   config     the rig's own settings file (markers, detector, background);
#              default "<label>.toml" beside this manifest, created if missing
#   device     camera: "auto", a number from `rekkefly --list-cameras`, a device
#              path (/dev/v4l/by-id/...) or part of the camera name
#   video      track a video file instead of a camera (relative to this file)
#   zmq_port   Kinefly-format ZMQ publisher port
#   udp_port   local port that sends full UDP measurements
#   udp_target where to send them, "IP:port"
#   record     start recording when the rig starts
#   enabled    false skips the rig
# Values given here apply to the run; anything left out comes from the rig's config.
# Rekkefly refuses to start if two rigs would share a camera, port, label or file.

[[rigs]]
label = "rig-a"
config = "camera-a.toml"
device = "0"
zmq_port = 9871
udp_port = 5501
udp_target = "127.0.0.1:5601"
record = false

[[rigs]]
label = "rig-b"
config = "camera-b.toml"
device = "1"
zmq_port = 9872
udp_port = 5502
udp_target = "127.0.0.1:5602"
record = false

