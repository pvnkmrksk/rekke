# First available camera, independent sender 5501 / receiver 5601.
instance = "rig-a"
preview_fps = 40
autosave = true

[source]
kind = "camera"
device = "auto"
width = 640
height = 480
fps = 30

[head]
x = 320.0
y = 175.0

[tail]
x = 320.0
y = 330.0

[tracking]
asymmetric = false
angle_bins = 240
radial_samples = 72
dark_on_light = true
subtract_background = false
background_path = "rig-a.background.png"

[tracking.left]
enabled = true
start_deg = 115.0
span_deg = 90.0
inner_radius = 55.0
outer_radius = 185.0
method = "edge"
threshold = 0.0
max_edges = 2
primary_edge = "strongest"
contrast_cap = 0.12
spike_width_deg = 5.0

[tracking.left.hinge]
x = 296.0
y = 240.0

[tracking.right]
enabled = true
start_deg = -25.0
span_deg = 90.0
inner_radius = 55.0
outer_radius = 185.0
method = "edge"
threshold = 0.0
max_edges = 2
primary_edge = "strongest"
contrast_cap = 0.12
spike_width_deg = 5.0

[tracking.right.hinge]
x = 344.0
y = 240.0

[tracking.head]
enabled = false
start_deg = -125.0
span_deg = 70.0
inner_radius = 12.0
outer_radius = 62.0
method = "centroid"
threshold = 0.0
max_edges = 2
primary_edge = "strongest"
contrast_cap = 0.12
spike_width_deg = 5.0

[tracking.head.hinge]
x = 320.0
y = 205.0

[tracking.abdomen]
enabled = false
start_deg = 55.0
span_deg = 70.0
inner_radius = 15.0
outer_radius = 88.0
method = "centroid"
threshold = 0.0
max_edges = 2
primary_edge = "strongest"
contrast_cap = 0.12
spike_width_deg = 5.0

[tracking.abdomen.hinge]
x = 320.0
y = 265.0

[output]
enabled = true
bind = "127.0.0.1:5501"
target = "127.0.0.1:5601"
jsonl_path = ""

zmq_enabled = true
zmq_bind = "tcp://*:9871"

[recording]
enabled = false
directory = "recordings"
queue_frames = 32
segment_mb = 1024
