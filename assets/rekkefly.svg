<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
 <defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#1e4a5a"/>
   <stop offset="1" stop-color="#091720"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.47" cy="0.5" r="0.5">
   <stop offset="0" stop-color="#46b3a8" stop-opacity="0.32"/>
   <stop offset="1" stop-color="#46b3a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="membrane" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#f4fffc"/>
   <stop offset="1" stop-color="#93e6d2"/>
  </linearGradient>
  <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
   <feGaussianBlur stdDeviation="9"/>
  </filter>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
   <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
   <feOffset dy="14"/>
   <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
   <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <path id="wing" d="M0 0C70 -34 250 -78 430 -84C530 -88 575 -40 560 4C545 48 470 84 340 90C210 96 90 64 26 26Z"/>
  <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
 </defs>
 <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/></g>
 <g clip-path="url(#clip)">
  <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  <!-- Stroke envelope: the motion blur of a beating wing -->
  <g transform="translate(246 700) rotate(-44)" fill="#a6f0de" filter="url(#blur)">
   <use href="#wing" transform="rotate(5.0)" opacity="0.156"/>
   <use href="#wing" transform="rotate(10.0)" opacity="0.142"/>
   <use href="#wing" transform="rotate(15.0)" opacity="0.128"/>
   <use href="#wing" transform="rotate(20.0)" opacity="0.113"/>
   <use href="#wing" transform="rotate(25.0)" opacity="0.099"/>
   <use href="#wing" transform="rotate(30.0)" opacity="0.085"/>
   <use href="#wing" transform="rotate(35.0)" opacity="0.071"/>
   <use href="#wing" transform="rotate(40.0)" opacity="0.057"/>
   <use href="#wing" transform="rotate(45.0)" opacity="0.043"/>
   <use href="#wing" transform="rotate(50.0)" opacity="0.028"/>
   <use href="#wing" transform="rotate(55.0)" opacity="0.014"/>
  </g>
  <!-- Wing -->
  <g transform="translate(246 700) rotate(-44)">
   <use href="#wing" fill="url(#membrane)"/>
   <g fill="none" stroke="#11444c" stroke-linecap="round" stroke-opacity="0.6">
    <path d="M8 -5C80 -40 260 -80 430 -84" stroke-width="9"/>
    <path d="M66 -28C150 -52 250 -70 335 -79" stroke-width="5"/>
    <path d="M60 -14C220 -30 420 -32 556 -6" stroke-width="5"/>
    <path d="M56 2C220 12 400 30 520 56" stroke-width="5"/>
    <path d="M50 16C150 40 240 70 300 90" stroke-width="5"/>
    <path d="M222 -22L226 10" stroke-width="4.5"/>
    <path d="M330 22L318 66" stroke-width="4.5"/>
   </g>
  </g>
  <!-- Detected leading edge and hinge -->
  <path d="M680.5 286.2L745.7 224.2" stroke="#ff917f" stroke-width="16" stroke-linecap="round"/>
  <circle cx="246" cy="700" r="19" fill="#ff917f"/>
 </g>
 <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>
</svg>
